spring:
  application:
    name: Laboratorio1Eduardo

  datasource:
    url: jdbc:postgresql://localhost:5433/laboratorio1
    username: postgres
    password: postgres

  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  jpa:
    hibernate:
      ddl-auto: validate


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/Laboratorio1Eduardo


server:
  servlet:
    context-path: /laboratorio1eduardochacon


keycloak:
  client-id: laboratorio1

  token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token